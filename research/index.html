<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Project Chimera research console: experiments, evaluation evidence, traces, audits, and reproducibility.">
<title>Chimera Research Console</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%2339d0d8'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23a78bfa' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5.5" fill="currentColor"/><circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.55"/><circle cx="27" cy="7" r="2.2" fill="currentColor" opacity="0.8"/></svg>
      <div class="brand-text"><span class="brand-name">Chimera</span><span class="brand-sub">Research Console</span></div>
    </div>
    <nav aria-label="Workspaces"><ul class="nav-list" id="nav-list"></ul></nav>
    <div class="sidebar-foot">
      <div class="data-dot" id="data-dot" role="status" aria-label="Data status"></div>
      <span id="data-status">Loading evidence…</span>
    </div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M2 5h16M2 10h16M2 15h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title">Command Center</div>
      <div class="topbar-badges" id="topbar-badges"></div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
    <footer class="footer">
      <span>Chimera Research Console · local evidence only · <button class="linklike" id="motion-toggle" aria-pressed="true">Motion: on</button></span>
      <span id="footer-status"></span>
    </footer>
  </div>
  <div class="scrim" id="scrim" hidden></div>
</div>
<noscript><p style="padding:2rem">This console needs JavaScript to inspect local evidence files.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
